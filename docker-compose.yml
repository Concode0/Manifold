services:
  node_01:
    build: .
    container_name: node_01
    command: ["-id", "node_01", "-addr", "node_01:8001", "-bind", "0.0.0.0:8001",
              "-c", "12", "-m", "8", "-n", "6", "-latency", "200ms",
              "-task", "-task-interval", "600ms", "-task-comp", "4", "-task-mem", "2", "-task-net", "1.5",
              "-hysteresis", "${HYSTERESIS:-0.15}"]
    networks: [basin_net]

  node_02:
    build: .
    container_name: node_02
    command: ["-id", "node_02", "-addr", "node_02:8001", "-bind", "0.0.0.0:8001",
              "-join", "node_01:8001",
              "-c", "6", "-m", "14", "-n", "4", "-latency", "150ms",
              "-hysteresis", "${HYSTERESIS:-0.15}"]
    depends_on: [node_01]
    networks: [basin_net]

  node_03:
    build: .
    container_name: node_03
    command: ["-id", "node_03", "-addr", "node_03:8001", "-bind", "0.0.0.0:8001",
              "-join", "node_01:8001,node_02:8001",
              "-c", "8", "-m", "6", "-n", "10", "-latency", "300ms",
              "-task", "-task-interval", "500ms", "-task-comp", "2", "-task-mem", "3", "-task-net", "2",
              "-hysteresis", "${HYSTERESIS:-0.15}"]
    depends_on: [node_01]
    networks: [basin_net]

  node_04:
    build: .
    container_name: node_04
    command: ["-id", "node_04", "-addr", "node_04:8001", "-bind", "0.0.0.0:8001",
              "-join", "node_02:8001,node_03:8001",
              "-c", "4", "-m", "12", "-n", "8", "-latency", "250ms",
              "-hysteresis", "${HYSTERESIS:-0.15}"]
    depends_on: [node_02]
    networks: [basin_net]

  node_05:
    build: .
    container_name: node_05
    command: ["-id", "node_05", "-addr", "node_05:8001", "-bind", "0.0.0.0:8001",
              "-join", "node_01:8001,node_03:8001",
              "-c", "10", "-m", "10", "-n", "5", "-latency", "200ms",
              "-task", "-task-interval", "700ms", "-task-comp", "3", "-task-mem", "1", "-task-net", "3",
              "-hysteresis", "${HYSTERESIS:-0.15}"]
    depends_on: [node_03]
    networks: [basin_net]

  node_06:
    build: .
    container_name: node_06
    command: ["-id", "node_06", "-addr", "node_06:8001", "-bind", "0.0.0.0:8001",
              "-join", "node_04:8001,node_05:8001",
              "-c", "14", "-m", "4", "-n", "7", "-latency", "180ms",
              "-hysteresis", "${HYSTERESIS:-0.15}"]
    depends_on: [node_04]
    networks: [basin_net]

  node_07:
    build: .
    container_name: node_07
    command: ["-id", "node_07", "-addr", "node_07:8001", "-bind", "0.0.0.0:8001",
              "-join", "node_03:8001,node_06:8001",
              "-c", "5", "-m", "8", "-n", "12", "-latency", "220ms",
              "-task", "-task-interval", "800ms", "-task-comp", "1.5", "-task-mem", "2.5", "-task-net", "1.5",
              "-hysteresis", "${HYSTERESIS:-0.15}"]
    depends_on: [node_06]
    networks: [basin_net]

  node_08:
    build: .
    container_name: node_08
    command: ["-id", "node_08", "-addr", "node_08:8001", "-bind", "0.0.0.0:8001",
              "-join", "node_05:8001,node_07:8001",
              "-c", "9", "-m", "11", "-n", "3", "-latency", "160ms",
              "-task", "-task-interval", "650ms", "-task-comp", "2.5", "-task-mem", "2", "-task-net", "1",
              "-hysteresis", "${HYSTERESIS:-0.15}"]
    depends_on: [node_07]
    networks: [basin_net]

networks:
  basin_net:
    driver: bridge
